name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build, publish, and release
    runs-on: ubuntu-latest
    environment: cd
    permissions:
      id-token: write    # required for OIDC trusted publisher (PyPI)
      contents: write    # required to create GitHub Release

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        enable-cache: true

    - name: Build package
      run: uv build

    - name: Publish to PyPI
      # Docker-based action: GitHub resolves the container image by this ref, and
      # pypa only publishes images under version tags -- not commit SHAs -- so a
      # SHA pin fails with "manifest unknown". Pin to the release tag instead.
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Create GitHub Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3
      with:
        generate_release_notes: true
        files: dist/*

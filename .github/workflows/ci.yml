name: CI

# NOTE: macOS is intentionally excluded from CI.
#
# The root cause is an Objective-C runtime class duplication between the FFmpeg
# dylibs bundled with OpenCV (cv2) and the Homebrew-installed FFmpeg required by
# torchcodec. Specifically, AVFFrameReceiver and AVFAudioReceiver are registered
# twice, which triggers undefined behaviour in the ObjC runtime. In practice this
# causes test hangs, spurious segfaults, and non-deterministic CI failures —
# roughly 3 out of 10 runs fail for reasons unrelated to the actual code under test.
#
# macOS development and testing continues to work via the local Makefile, where
# the environment is more controlled. Linux (ubuntu-latest) remains the primary
# CI target; this is also the production deployment platform.
#
# This restriction will be revisited once a clean solution is identified.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal token scope: the job only needs to read the repository (checkout).
# Coverage upload uses CODECOV_TOKEN, not GITHUB_TOKEN, so no write scope is required.
permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }}${{ matrix.torch-floor && ', torch2.11' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every leg is listed explicitly under `include` (no bare axis) so job identities
      # never collide: a bare `python-version` axis plus an `include` that re-uses an
      # existing value MERGES into that combination instead of adding a new job, which
      # would silently drop the plain "py3.12" leg (and its required-check name).
      #
      # Legs: the Python floor (3.12) through the latest stable (3.14), each on the
      # newest torch set the ranges allow (currently 2.13); PLUS one floor leg that
      # pins the torch 2.11 generation so the *bottom* of torch>=2.11 is proven too
      # (downstream gradio ZeroGPU demos hold the stack there). One torch-floor leg on
      # Python 3.12 is enough -- the ABI-matched set is Python-independent in our range.
      matrix:
        include:
          - python-version: "3.12"
          - python-version: "3.13"
          - python-version: "3.14"
          - python-version: "3.12"
            torch-floor: true

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # required for hatch-vcs git describe

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        enable-cache: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libgles2 libegl1

    # Pin the torch 2.11-generation ABI-matched set for the floor leg. torchvision is
    # co-versioned with torch (0.26 <-> 2.11); torchaudio/torchcodec follow their ranges.
    - name: Constrain torch stack to the 2.11 floor
      if: matrix.torch-floor
      run: |
        printf 'torch==2.11.0\ntorchvision==0.26.0\n' > /tmp/torch-floor.txt
        echo "UV_CONSTRAINT=/tmp/torch-floor.txt" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: |
        # On Linux CI, use CPU-only PyTorch wheels to avoid CUDA runtime
        # dependencies (e.g. libnppicc.so) that are absent on the runner.
        # PEP 440 ignores local version segments, so torch==2.11.0 matches
        # both 2.11.0+cu130 (PyPI default) and 2.11.0+cpu (CPU index).
        # UV_CONSTRAINT (set only on the torch-floor leg) pins the 2.11 set.
        uv pip install --system --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match -e ".[all,dev,docs]"

    - name: Show resolved torch stack
      run: |
        uv pip show --system torch torchvision torchaudio torchcodec 2>/dev/null \
          | grep -E '^(Name|Version):' || true

    # Model weights dominate CI time: the suite pulls several GB of checkpoints
    # (HuggingFace, torch.hub, exordium-weights) and without this they are
    # re-downloaded on every run. Bump the key's version suffix when a new model
    # is added, so the cache is rebuilt to include it.
    - name: Cache model weights
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/huggingface
          ~/.cache/torch
          tools
        key: weights-v1-${{ runner.os }}
        restore-keys: |
          weights-v1-
          weights-

    - name: Audit dependencies for vulnerabilities
      run: uvx pip-audit
      continue-on-error: true  # torch/mediapipe may have known CVEs; treat as warning

    - name: Ruff Lint
      run: ruff check .

    - name: Ruff Format
      run: ruff format --check .

    - name: Type check (ty)
      run: ty check exordium

    - name: Test & Coverage
      run: |
        coverage run -m unittest discover -s tests -v
        coverage report
        coverage html
        coverage xml -o coverage.xml

    - name: Upload coverage reports to Codecov
      # Coverage is identical across the matrix; upload once (from the plain 3.12 leg,
      # excluding the torch-floor leg) to avoid duplicate/conflicting reports on Codecov.
      if: matrix.python-version == '3.12' && !matrix.torch-floor
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        fail_ci_if_error: true

    - name: Upload coverage HTML
      # One artifact name across the matrix would collide; upload from one leg only.
      if: always() && matrix.python-version == '3.12' && !matrix.torch-floor
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage_html/

    - name: Build docs
      run: sphinx-build -b html docs/ site/

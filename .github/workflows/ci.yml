name: CI

# NOTE: macOS is intentionally excluded from CI.
#
# The root cause is an Objective-C runtime class duplication between the FFmpeg
# dylibs bundled with OpenCV (cv2) and the Homebrew-installed FFmpeg required by
# torchcodec. Specifically, AVFFrameReceiver and AVFAudioReceiver are registered
# twice, which triggers undefined behaviour in the ObjC runtime. In practice this
# causes test hangs, spurious segfaults, and non-deterministic CI failures —
# roughly 3 out of 10 runs fail for reasons unrelated to the actual code under test.
#
# macOS development and testing continues to work via the local Makefile, where
# the environment is more controlled. Linux (ubuntu-latest) remains the primary
# CI target; this is also the production deployment platform.
#
# This restriction will be revisited once a clean solution is identified.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal token scope: the job only needs to read the repository (checkout).
# Coverage upload uses CODECOV_TOKEN, not GITHUB_TOKEN, so no write scope is required.
permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python floor) through the latest stable release.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # required for hatch-vcs git describe

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        enable-cache: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libgles2 libegl1

    - name: Install dependencies
      run: |
        # On Linux CI, use CPU-only PyTorch wheels to avoid CUDA runtime
        # dependencies (e.g. libnppicc.so) that are absent on the runner.
        # PEP 440 ignores local version segments, so torch==2.11.0 matches
        # both 2.11.0+cu130 (PyPI default) and 2.11.0+cpu (CPU index).
        uv pip install --system --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match -e ".[all,dev,docs]"

    # Model weights dominate CI time: the suite pulls several GB of checkpoints
    # (HuggingFace, torch.hub, exordium-weights) and without this they are
    # re-downloaded on every run. Bump the key's version suffix when a new model
    # is added, so the cache is rebuilt to include it.
    - name: Cache model weights
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/huggingface
          ~/.cache/torch
          tools
        key: weights-v1-${{ runner.os }}
        restore-keys: |
          weights-v1-
          weights-

    - name: Audit dependencies for vulnerabilities
      run: uvx pip-audit
      continue-on-error: true  # torch/mediapipe may have known CVEs; treat as warning

    - name: Ruff Lint
      run: ruff check .

    - name: Ruff Format
      run: ruff format --check .

    - name: Type check (ty)
      run: ty check exordium

    - name: Test & Coverage
      run: |
        coverage run -m unittest discover -s tests -v
        coverage report
        coverage html
        coverage xml -o coverage.xml

    - name: Upload coverage reports to Codecov
      # Coverage is identical across the matrix; upload once (from the floor version)
      # to avoid duplicate/conflicting reports on Codecov.
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        fail_ci_if_error: true

    - name: Upload coverage HTML
      # One artifact name across the matrix would collide; upload from one version only.
      if: always() && matrix.python-version == '3.12'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage_html/

    - name: Build docs
      run: sphinx-build -b html docs/ site/

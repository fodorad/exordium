[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "exordium"
dynamic = ["version"]
description = "Collection of utility tools and deep learning methods for multimodal feature extraction."
keywords = ["preprocess", "audio", "video", "text", "utils", "multimodal", "detection", "tracking"]
authors = [
  { name = "fodorad", email = "fodorad201@gmail.com" },
]
readme = {"file" = "README.md", "content-type" = "text/markdown"}
requires-python = ">=3.12"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "opencv-python",
  "scipy",
  # ── PyTorch ecosystem version range ──────────────────────────────────────────
  # These declare a *range* rather than one exact generation, so a downstream repo
  # (e.g. a gradio ZeroGPU demo held at torch 2.11) can install exordium without a
  # conflict, while development and CI resolve to the newest set in the window.
  #
  # torchvision is ABI-coupled to torch and hard-pins one exact torch per release
  # (0.26 -> torch 2.11, 0.27 -> 2.12, 0.28 -> 2.13). Mixing halves across generations
  # installs cleanly then fails at import: "operator torchvision::nms does not exist".
  # The coupled ranges keep torch and torchvision in lock-step, so the resolver can
  # only land on a valid pair; the consumer's own pin picks which one (>=2.11 floor).
  #
  # torchaudio is NOT co-versioned with torch. On PyPI -- the index this repo resolves
  # from -- its newest release is 2.11.0 (2.12/2.13 exist only on download.pytorch.org).
  # 2.11.0 runs fine on the whole torch 2.11-2.13 range: forced_align and the MMS_FA
  # bundle, the native ops used here, both load. The range below resolves it to 2.11.0.
  #
  # torchcodec (0.14-0.15) supports torch >= 2.11 and is not torch-co-versioned.
  #
  # Load-bearing ops to re-verify if you shift the floor: torch.ops.torchvision.nms,
  # torchaudio.functional.forced_align, torchaudio.pipelines.MMS_FA, torchcodec decoders.
  # CI's 3.12/3.13/3.14 matrix resolves and exercises the top of the range.
  # ─────────────────────────────────────────────────────────────────────────────
  "torch>=2.11,<2.14",
  "torchaudio>=2.11,<2.14",
  "torchvision>=0.26,<0.29",
  "torchcodec>=0.14,<0.16",
  "tqdm",
  "matplotlib",
  "huggingface_hub",
  "transformers",
  "safetensors",
]

[project.optional-dependencies]
audio = [
  "opensmile",
  "torchaudio",
]
text = [
  "transformers",
  "torchaudio",
  "rapidfuzz",
  # whisperX — wav2vec2 forced-alignment backend for word-level timestamps.
  # Pulls the pyannote-audio / faster-whisper / ctranslate2 stack; the torch
  # generation and numpy/pandas/transformers versions are held at the repo pins
  # by the ``override-dependencies`` safety belt in ``[tool.uv]``.
  "whisperx",
]
video = [
  "mediapipe",
  "ultralytics",
  "unigaze",
  "timm",
  "marlin-pytorch",
  "einops",
]
dev = [
  "ruff",
  "ty",
  "coverage",
  "pre-commit",
  "ipykernel",  # run the example notebooks in examples/
]
docs = [
  "sphinx>=8.0",
  "furo",
  "sphinx-autoapi",
  "sphinx-autobuild",
  "myst-parser",
]
all = [
  "exordium[audio,video,text]",
]

[project.urls]
Documentation = "https://fodorad.github.io/exordium/"
Issues = "https://github.com/fodorad/exordium/issues"
Source = "https://github.com/fodorad/exordium"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["exordium"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "TCH", "ARG", "PIE", "D"]
ignore = [
  "D107",  # Missing docstring in __init__ (covered by class docstring)
  "D203",  # Blank line before class (conflicts with D211)
  "D213",  # Multi-line summary second line (conflicts with D212)
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/**/test_*.py" = ["D", "S", "ARG"]
"docs/conf.py" = ["D", "ARG"]
"examples/*.ipynb" = ["D", "E501", "E741"]

[tool.coverage.run]
source = ["exordium"]
omit = [
  "*/tests/*",
  "*/__init__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "coverage_html"

[tool.uv]
override-dependencies = [
  "timm>=1.0",  # unigaze pins timm==0.3.2; override it
  # whisperX (and pyannote-audio) declare conservative torch pins (~=2.8) and a
  # requires-python <3.14 upper bound. Empirically whisperx 3.7.2 works fine on this
  # repo's torch / py3.14, so we override its pins and let uv resolve whisperx against
  # the repo's torch range instead of dragging torch below the 2.11 floor.
  #
  # These mirror the coupled ranges in [project.dependencies] (see the comment there
  # for the three valid matched sets). They stay ranges, not exact pins, so a consumer
  # can hold the stack at torch 2.11 without exordium's override forcing it to 2.13.
  "torch>=2.11,<2.14",
  "torchaudio>=2.11,<2.14",
  "torchvision>=0.26,<0.29",
  "torchcodec>=0.14,<0.16",
  # Hold transformers at latest 5.x; the whisperx stack otherwise pulls it down
  # to 4.57. Verified whisperx alignment + the existing wrappers work on 5.x.
  "transformers>=5.5",
  # whisperx 3.7.x caps numpy<2.3 / pandas<2.3, but those have no stable
  # Python 3.14 wheels and ABI-segfault opensmile. Hold them at the repo's
  # working versions; whisperx alignment is verified to work on them.
  "numpy>=2.4",
  "pandas>=3.0",
]

[tool.ty.environment]
python-version = "3.12"
